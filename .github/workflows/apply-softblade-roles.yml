name: Apply Softblade-style role panels

on:
  push:
    paths:
      - '.github/workflows/apply-softblade-roles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert Zabi roles channel to Softblade reaction panels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          code = path.read_text(encoding='utf-8')

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'No encontré inicio: {start!r}')
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f'No encontré fin: {end!r}')
              return text[:i] + replacement + text[j:]

          # 1) Misma configuración de reaction roles que usa el Streamer Bot.
          if 'ROLE_PANEL_COUNTRY_TITLE = "🌎 Elegí tu país"' not in code:
              marker = 'LEGACY_ROLE_ALIASES = {'
              block = '''AGE_REACTION_ROLES = {
    "🧒": "🧒・Menor de 18",
    "🎂": "🎂・18-25",
    "🧑": "🧑・26+",
}

COUNTRY_REACTION_ROLES = {name.split("・", 1)[0]: name for name in COUNTRIES}

# Si Zabi Army tiene emojis personalizados de rangos con estos nombres, se usan.
# Si no existen, el panel usa automáticamente los emojis Unicode de los roles.
VALORANT_CUSTOM_EMOJIS = {
    "⚫・Sin rango": None,
    "⬛・Hierro": "valoranthierro",
    "🟫・Bronce": "valorantbronce",
    "⬜・Plata": "valorantplata",
    "🟨・Oro": "valorantoro",
    "🟩・Platino": "valorantplatino",
    "💎・Diamante": "valorantdiamante",
    "🟪・Ascendente": "valorantascendente",
    "🟥・Inmortal": "valorantimmortal",
    "🌟・Radiante": "valorantradiante",
}

ROLE_PANEL_COUNTRY_TITLE = "🌎 Elegí tu país"
ROLE_PANEL_AGE_TITLE = "🎂 Elegí tu rango de edad"
ROLE_PANEL_RANK_TITLE = "🔫 Elegí tu rango de Valorant"
ROLE_PANEL_GAMES_TITLE = "🎮 Elegí tus juegos"
ROLE_PANEL_PLATFORM_TITLE = "🖥️ Elegí tus plataformas"
ROLE_PANEL_NOTIFY_TITLE = "📣 Elegí tus avisos"
GAME_REACTION_ROLES = {"🔫": ROLE_GAME_VALORANT, "⛏️": ROLE_GAME_MINECRAFT, "🎮": ROLE_GAME_OTHER}
PLATFORM_REACTION_ROLES = {"🖥️": ROLE_PLATFORM_PC, "🎮": ROLE_PLATFORM_CONSOLE, "📱": ROLE_PLATFORM_MOBILE}
NOTIFY_REACTION_ROLES = {"🔔": ROLE_LIVE_NOTIFY, "🎉": ROLE_EVENT_NOTIFY}

'''
              code = code.replace(marker, block + marker, 1)

          # 2) Utilidades equivalentes al bot de s0ftbl4de.
          if 'def build_rank_reaction_roles(' not in code:
              marker = '\n\ndef is_staff(member: discord.Member) -> bool:'
              block = r'''


def build_rank_reaction_roles(guild: discord.Guild) -> dict[str, str]:
    mapping: dict[str, str] = {}
    for role_name in VALORANT_RANKS:
        emoji_name = VALORANT_CUSTOM_EMOJIS.get(role_name)
        if emoji_name:
            custom_emoji = discord.utils.get(guild.emojis, name=emoji_name)
            if custom_emoji is not None:
                mapping[str(custom_emoji)] = role_name
                continue
        mapping[role_name.split("・", 1)[0]] = role_name
    return mapping


def role_panel_line(guild: discord.Guild, emoji: str, role_name: str) -> str:
    role = find_role(guild, role_name)
    label = role.mention if role is not None else f"**{role_name.split('・', 1)[-1]}**"
    return f"{emoji} ─ {label}"
'''
              if marker not in code:
                  raise SystemExit('No encontré marcador is_staff')
              code = code.replace(marker, block + marker, 1)

          # 3) Paneles por reacciones: mismo diseño/funcionamiento que Softblade.
          if 'async def ensure_role_reaction_panels(' not in code:
              marker = '# ──────────────────────────────────────────────────────────────────────────────\n# VERIFICACIÓN / BIENVENIDAS\n'
              block = r'''

async def ensure_reaction_role_panel(
    channel: discord.TextChannel,
    title: str,
    description: str,
    mapping: dict[str, str],
) -> discord.Message:
    matches = await bot_embed_messages(channel, title, limit=500)
    embed = discord.Embed(title=title, description=description, colour=discord.Colour.blurple())
    embed.set_footer(text="Reaccioná para asignarte el rol • Quitá tu reacción para quitarlo")

    if matches:
        message = matches[0]
        try:
            await message.edit(embed=embed, view=None, allowed_mentions=discord.AllowedMentions.none())
        except (discord.Forbidden, discord.NotFound, discord.HTTPException):
            pass
        for duplicate in matches[1:]:
            try:
                await duplicate.delete()
            except (discord.Forbidden, discord.NotFound, discord.HTTPException):
                pass
    else:
        message = await channel.send(embed=embed, allowed_mentions=discord.AllowedMentions.none())

    wanted = set(mapping.keys())
    for reaction in list(message.reactions):
        if str(reaction.emoji) not in wanted:
            try:
                await message.clear_reaction(reaction.emoji)
            except (discord.Forbidden, discord.NotFound, discord.HTTPException):
                pass

    try:
        message = await channel.fetch_message(message.id)
    except (discord.Forbidden, discord.NotFound, discord.HTTPException):
        pass

    existing = {str(reaction.emoji) for reaction in message.reactions}
    for emoji in mapping:
        if emoji in existing:
            continue
        try:
            reaction_emoji = discord.PartialEmoji.from_str(emoji) if emoji.startswith("<") else emoji
            await message.add_reaction(reaction_emoji)
            existing.add(emoji)
        except (discord.Forbidden, discord.NotFound, discord.HTTPException, ValueError):
            pass
    return message


async def get_reaction_panel_mapping(payload: discord.RawReactionActionEvent):
    guild = bot.get_guild(payload.guild_id) if payload.guild_id else None
    if guild is None:
        return None, None, None, False

    channel = guild.get_channel(payload.channel_id)
    roles_channel = find_text(guild, CH_ROLES)
    if not isinstance(channel, discord.TextChannel) or roles_channel is None or channel.id != roles_channel.id:
        return guild, None, None, False

    try:
        message = await channel.fetch_message(payload.message_id)
    except (discord.NotFound, discord.Forbidden, discord.HTTPException):
        return guild, None, None, False

    if not message.embeds:
        return guild, message, None, False

    title = message.embeds[0].title
    if title == ROLE_PANEL_COUNTRY_TITLE:
        return guild, message, COUNTRY_REACTION_ROLES, True
    if title == ROLE_PANEL_AGE_TITLE:
        return guild, message, AGE_REACTION_ROLES, True
    if title == ROLE_PANEL_RANK_TITLE:
        return guild, message, build_rank_reaction_roles(guild), True
    if title == ROLE_PANEL_GAMES_TITLE:
        return guild, message, GAME_REACTION_ROLES, False
    if title == ROLE_PANEL_PLATFORM_TITLE:
        return guild, message, PLATFORM_REACTION_ROLES, False
    if title == ROLE_PANEL_NOTIFY_TITLE:
        return guild, message, NOTIFY_REACTION_ROLES, False
    return guild, message, None, False


async def reaction_member(guild: discord.Guild, user_id: int) -> Optional[discord.Member]:
    member = guild.get_member(user_id)
    if member is not None:
        return member
    try:
        return await guild.fetch_member(user_id)
    except (discord.NotFound, discord.Forbidden, discord.HTTPException):
        return None


async def ensure_role_reaction_panels(
    guild: discord.Guild,
    channel: Optional[discord.TextChannel] = None,
) -> None:
    channel = channel or find_text(guild, CH_ROLES)
    if channel is None:
        return

    # Limpia el panel viejo de selectores/botones y la guía genérica.
    old_titles = {"🎭 Elegí tus roles", "🌎 Roles de perfil", f"{GUIDE_PREFIX}Roles"}
    try:
        async for message in channel.history(limit=300):
            if message.author == guild.me and message.embeds and message.embeds[0].title in old_titles:
                try:
                    await message.delete()
                except (discord.Forbidden, discord.NotFound, discord.HTTPException):
                    pass
    except (discord.Forbidden, discord.HTTPException):
        pass

    country_lines = "\n".join(
        role_panel_line(guild, emoji, role_name)
        for emoji, role_name in COUNTRY_REACTION_ROLES.items()
    )
    await ensure_reaction_role_panel(
        channel,
        ROLE_PANEL_COUNTRY_TITLE,
        "↳ **Seleccioná tu nacionalidad.**\n\n"
        + country_lines
        + "\n\nSolo podés tener **un país** a la vez. Si reaccionás a otro, el bot reemplaza el anterior.",
        COUNTRY_REACTION_ROLES,
    )

    age_lines = "\n".join(
        role_panel_line(guild, emoji, role_name)
        for emoji, role_name in AGE_REACTION_ROLES.items()
    )
    await ensure_reaction_role_panel(
        channel,
        ROLE_PANEL_AGE_TITLE,
        "↳ **Seleccioná tu rango de edad.** No hace falta decir tu edad exacta.\n\n"
        + age_lines
        + "\n\nSolo podés tener **un rango de edad** a la vez.",
        AGE_REACTION_ROLES,
    )

    rank_mapping = build_rank_reaction_roles(guild)
    rank_lines = "\n".join(
        role_panel_line(guild, emoji, role_name)
        for emoji, role_name in rank_mapping.items()
    )
    await ensure_reaction_role_panel(
        channel,
        ROLE_PANEL_RANK_TITLE,
        "↳ **Seleccioná tu rango actual.**\n\n"
        + rank_lines
        + "\n\nSolo podés tener **un rango** a la vez. Si cambiás, se reemplaza automáticamente.",
        rank_mapping,
    )

    game_lines = "\n".join(
        role_panel_line(guild, emoji, role_name)
        for emoji, role_name in GAME_REACTION_ROLES.items()
    )
    await ensure_reaction_role_panel(
        channel,
        ROLE_PANEL_GAMES_TITLE,
        "↳ **Elegí los juegos que te interesan.** Podés marcar varios.\n\n" + game_lines,
        GAME_REACTION_ROLES,
    )

    platform_lines = "\n".join(
        role_panel_line(guild, emoji, role_name)
        for emoji, role_name in PLATFORM_REACTION_ROLES.items()
    )
    await ensure_reaction_role_panel(
        channel,
        ROLE_PANEL_PLATFORM_TITLE,
        "↳ **Elegí dónde jugás.** Podés marcar varias plataformas.\n\n" + platform_lines,
        PLATFORM_REACTION_ROLES,
    )

    notify_lines = "\n".join(
        role_panel_line(guild, emoji, role_name)
        for emoji, role_name in NOTIFY_REACTION_ROLES.items()
    )
    await ensure_reaction_role_panel(
        channel,
        ROLE_PANEL_NOTIFY_TITLE,
        "↳ **Elegí qué avisos querés recibir.** Podés marcar más de uno.\n\n"
        + notify_lines
        + "\n\nQuitá una reacción cuando quieras dejar de recibir ese aviso.",
        NOTIFY_REACTION_ROLES,
    )

'''
              if marker not in code:
                  raise SystemExit('No encontré marcador VERIFICACIÓN / BIENVENIDAS')
              code = code.replace(marker, block + marker, 1)

          # 4) ensure_panels deja de usar el panel con selectores y usa los 6 embeds de Softblade.
          start = '    if roles:\n'
          end = '    if suggestions:\n'
          i = code.find(start, code.find('async def ensure_panels'))
          if i < 0:
              raise SystemExit('No encontré bloque de roles en ensure_panels')
          j = code.find(end, i)
          if j < 0:
              raise SystemExit('No encontré suggestions después de roles')
          code = code[:i] + '    if roles:\n        await ensure_role_reaction_panels(guild, roles)\n\n' + code[j:]

          # En Softblade los paneles de roles ya son su propia explicación; no agregamos una guía extra.
          code = code.replace(
              '        (CH_ROLES, "Roles", "Elegí país, rango de edad, rango de Valorant, juegos, plataformas y avisos del servidor."),\n',
              '',
              1,
          )

          # /actualizar-roles actualiza solo el sistema de roles, sin recrear otros paneles.
          old = '''        roles_channel = find_text(interaction.guild, CH_ROLES)\n        if roles_channel:\n            await ensure_panels(interaction.guild)\n'''
          new = '''        roles_channel = find_text(interaction.guild, CH_ROLES)\n        if roles_channel:\n            await ensure_role_reaction_panels(interaction.guild, roles_channel)\n'''
          if old in code:
              code = code.replace(old, new, 1)

          # 5) Reacciones de roles: misma lógica exclusiva/múltiple del Streamer Bot.
          raw_start = '@bot.event\nasync def on_raw_reaction_add(payload: discord.RawReactionActionEvent):\n'
          voice_start = '@bot.event\nasync def on_voice_state_update(member: discord.Member, before: discord.VoiceState, after: discord.VoiceState):\n'
          replacement = r'''@bot.event
async def on_raw_reaction_add(payload: discord.RawReactionActionEvent):
    if bot.user is None or payload.user_id == bot.user.id or payload.guild_id is None:
        return

    await handle_suggestion_reaction(payload, True)

    guild, message, mapping, exclusive = await get_reaction_panel_mapping(payload)
    if guild is None or message is None or mapping is None:
        return

    emoji = str(payload.emoji)
    role_name = mapping.get(emoji)
    if role_name is None:
        return

    member = await reaction_member(guild, payload.user_id)
    if member is None or member.bot:
        return

    selected = find_role(guild, role_name)
    if selected is None:
        return

    group_role_names = set(mapping.values())
    old_roles = [
        role for role in member.roles
        if role.name in group_role_names and role != selected
    ] if exclusive else []

    try:
        if old_roles:
            await member.remove_roles(*old_roles, reason="Cambio de reaction role visual")
        if selected not in member.roles:
            await member.add_roles(selected, reason="Reaction role visual")
    except discord.Forbidden:
        return

    if exclusive:
        for reaction in message.reactions:
            reaction_emoji = str(reaction.emoji)
            if reaction_emoji in mapping and reaction_emoji != emoji:
                try:
                    await reaction.remove(member)
                except (discord.Forbidden, discord.HTTPException):
                    pass


@bot.event
async def on_raw_reaction_remove(payload: discord.RawReactionActionEvent):
    if bot.user is None or payload.user_id == bot.user.id or payload.guild_id is None:
        return

    await handle_suggestion_reaction(payload, False)

    guild, _message, mapping, _exclusive = await get_reaction_panel_mapping(payload)
    if guild is None or mapping is None:
        return

    role_name = mapping.get(str(payload.emoji))
    if role_name is None:
        return

    member = await reaction_member(guild, payload.user_id)
    role = find_role(guild, role_name)
    if member is None or role is None or role not in member.roles:
        return

    try:
        await member.remove_roles(role, reason="Reaction role retirada")
    except discord.Forbidden:
        pass


'''
          code = replace_between(code, raw_start, voice_start, replacement)

          # Ya no usamos el selector persistente antiguo.
          code = code.replace('    bot.add_view(RolePanelView())\n', '', 1)

          # Validaciones de estructura.
          required = [
              'ROLE_PANEL_COUNTRY_TITLE = "🌎 Elegí tu país"',
              'async def ensure_role_reaction_panels(',
              'async def ensure_reaction_role_panel(',
              'async def get_reaction_panel_mapping(',
              'await ensure_role_reaction_panels(guild, roles)',
              'await handle_suggestion_reaction(payload, True)',
              'await handle_suggestion_reaction(payload, False)',
          ]
          for item in required:
              if item not in code:
                  raise SystemExit(f'Falta tras parche: {item}')

          path.write_text(code, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile bot.py

      - name: Validate role-panel markers
        shell: bash
        run: |
          grep -q '🌎 Elegí tu país' bot.py
          grep -q '🎂 Elegí tu rango de edad' bot.py
          grep -q '🔫 Elegí tu rango de Valorant' bot.py
          grep -q '🎮 Elegí tus juegos' bot.py
          grep -q '🖥️ Elegí tus plataformas' bot.py
          grep -q '📣 Elegí tus avisos' bot.py

      - name: Commit bot update
        shell: bash
        run: |
          git config user.name "xLemonPay Bot Update"
          git config user.email "actions@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Match Zabi role channel to Softblade reaction panels"
          git push
