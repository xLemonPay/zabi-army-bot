name: Validate Zabi Army Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile bot
        run: python -m py_compile bot.py role_panels.py zabi_runner.py
      - name: Import integration
        run: python -c "import bot, role_panels; role_panels.install(bot); print('role panels integration ok')"
