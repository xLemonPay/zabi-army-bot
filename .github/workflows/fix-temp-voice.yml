name: Fix temporary voice rooms

on:
  push:
    paths:
      - '.github/workflows/fix-temp-voice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch temporary voice rooms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          code = path.read_text(encoding='utf-8')

          if 'TEMP_VC_PREFIX = ' not in code:
              code = code.replace(
                  'VC_CREATE = "➕・crear-sala"\n',
                  'VC_CREATE = "➕・crear-sala"\nTEMP_VC_PREFIX = "🎧・Sala de "\n',
                  1,
              )

          if 'intents.voice_states = True' not in code:
              code = code.replace(
                  'intents.members = True\n',
                  'intents.members = True\nintents.voice_states = True\n',
                  1,
              )

          handler = r'''

# ──────────────────────────────────────────────────────────────────────────────
# SALAS DE VOZ TEMPORALES
# ──────────────────────────────────────────────────────────────────────────────

@bot.event
async def on_voice_state_update(
    member: discord.Member,
    before: discord.VoiceState,
    after: discord.VoiceState,
):
    # Entrar en ➕・crear-sala crea una sala propia y mueve al usuario.
    if after.channel and after.channel.name == VC_CREATE:
        category = after.channel.category
        if category is not None:
            overwrites = dict(category.overwrites)
            overwrites[member] = discord.PermissionOverwrite(
                view_channel=True,
                connect=True,
                speak=True,
                stream=True,
                manage_channels=True,
                move_members=True,
                mute_members=True,
                deafen_members=True,
            )
            try:
                temp = await member.guild.create_voice_channel(
                    name=f"{TEMP_VC_PREFIX}{member.display_name}"[:100],
                    category=category,
                    overwrites=overwrites,
                    user_limit=0,
                    reason="Sala temporal creada automáticamente",
                )
                await member.move_to(temp, reason="Mover a su sala temporal")
            except discord.Forbidden:
                print("⚠️ No pude crear/mover a la sala temporal: faltan Gestionar canales o Mover miembros.")
            except discord.HTTPException as exc:
                print(f"⚠️ Error creando sala temporal: {exc}")

    # Al quedar vacía una sala temporal, se elimina automáticamente.
    if before.channel and before.channel.name.startswith(TEMP_VC_PREFIX):
        await asyncio.sleep(1)
        if len(before.channel.members) == 0:
            try:
                await before.channel.delete(reason="Sala temporal vacía")
            except (discord.NotFound, discord.Forbidden, discord.HTTPException):
                pass
'''

          marker = '# ──────────────────────────────────────────────────────────────────────────────\n# HEALTH + ARRANQUE\n'
          if 'async def on_voice_state_update(' not in code:
              if marker not in code:
                  raise SystemExit('No encontré el marcador HEALTH + ARRANQUE')
              code = code.replace(marker, handler + '\n\n' + marker, 1)

          assert 'TEMP_VC_PREFIX = "🎧・Sala de "' in code
          assert 'intents.voice_states = True' in code
          assert 'async def on_voice_state_update(' in code
          assert 'await member.guild.create_voice_channel(' in code

          path.write_text(code, encoding='utf-8')
          PY

      - name: Validate Python
        run: python -m py_compile bot.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "xLemonPay Bot Update"
          git config user.email "actions@users.noreply.github.com"
          git add bot.py
          git rm .github/workflows/fix-temp-voice.yml
          git commit -m "Fix temporary voice room system"
          git push
